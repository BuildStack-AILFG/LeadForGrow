          - generic [ref=f6e70]:
            - paragraph [ref=f6e71]: "01"
            - heading "Encryption" [level=2] [ref=f6e72]
            - paragraph [ref=f6e73]: Data in transit is protected with TLS — the website and the app are served over HTTPS. Sensitive credentials are encrypted at rest with AES-256.
            - generic [ref=f6e74]:
              - paragraph [ref=f6e75]: In practice
              - list [ref=f6e76]:
                - listitem [ref=f6e77]: WhatsApp, Instagram and Facebook access tokens, email passwords and your own AI key are stored encrypted
                - listitem [ref=f6e78]: Encrypted credentials are never sent back to the browser — settings only show whether one is saved
          - generic [ref=f6e79]:
            - paragraph [ref=f6e80]: "02"
            - heading "Authentication" [level=2] [ref=f6e81]
            - paragraph [ref=f6e82]: Passwords are hashed with bcrypt before they are stored. Signed-in sessions use signed tokens that expire.
            - generic [ref=f6e83]:
              - paragraph [ref=f6e84]: In practice
              - list [ref=f6e85]:
                - listitem [ref=f6e86]: We never store passwords in readable form
                - listitem [ref=f6e87]: Sign-in attempts are rate-limited
          - generic [ref=f6e88]:
            - paragraph [ref=f6e89]: "03"
            - heading "Access control" [level=2] [ref=f6e90]
            - paragraph [ref=f6e91]: Six built-in roles — Owner, Admin, Manager, Sales Agent, Support and Viewer — decide who can see and change what. Owners can also lock individual pages per role.
            - generic [ref=f6e92]:
              - paragraph [ref=f6e93]: In practice
              - list [ref=f6e94]:
                - listitem [ref=f6e95]: Salespeople can be limited to their own leads in views such as Leak Radar
                - listitem [ref=f6e96]: Security and admin activity is recorded in an audit log with who did it and when
          - generic [ref=f6e97]:
            - paragraph [ref=f6e98]: "04"
            - heading "Workspace isolation" [level=2] [ref=f6e99]
            - paragraph [ref=f6e100]: Each business is a separate workspace. Leads, conversations, settings and files are stored and queried per workspace, so your team works only with your own business’s data.
            - generic [ref=f6e101]:
              - paragraph [ref=f6e102]: In practice
              - list [ref=f6e103]:
                - listitem [ref=f6e104]: Diagnostic and webhook tools only show your own workspace’s records
          - generic [ref=f6e105]:
            - paragraph [ref=f6e106]: "05"
            - heading "Inbound webhooks" [level=2] [ref=f6e107]
            - paragraph [ref=f6e108]: Messages and events from Meta are accepted only with a valid X-Hub-Signature-256. Requests with a missing or wrong signature are refused, not processed.
            - generic [ref=f6e109]:
              - paragraph [ref=f6e110]: In practice
              - list [ref=f6e111]:
                - listitem [ref=f6e112]: Workflow webhook secrets are compared in constant time
                - listitem [ref=f6e113]: Credential headers are removed before webhook payloads are logged
          - generic [ref=f6e114]:
            - paragraph [ref=f6e115]: "06"
            - heading "Responsible disclosure" [level=2] [ref=f6e116]
            - paragraph [ref=f6e117]: Report vulnerabilities to security@leadforgrow.com. We aim to respond within 72 hours.
            - generic [ref=f6e118]:
              - paragraph [ref=f6e119]: In practice
