name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/leadforgrow_test
      JWT_SECRET: ci-test-jwt-secret-minimum-32-characters-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Run smoke checks
        run: npm run smoke

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Security audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true
